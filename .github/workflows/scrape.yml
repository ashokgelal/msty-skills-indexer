name: Scrape Skills Index

on:
  workflow_dispatch:
    inputs:
      max_detail_pages:
        description: "Maximum detail pages to refresh in this run"
        required: false
        default: "1000"
      full_recrawl:
        description: "Ignore refresh windows and refresh from the start of the queue"
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  group: skills-indexer
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and upload index
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PREFIX: ${{ vars.R2_PREFIX || 'app/latest/assets/mstySkills' }}
          LATEST_ASSET_KEY: ${{ vars.LATEST_ASSET_KEY || 'app/latest/assets/mstySkills.json' }}
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL || '<PUBLIC_BASE_URL>' }}
          MAX_DETAIL_PAGES: ${{ github.event.inputs.max_detail_pages || '1000' }}
          FULL_RECRAWL: ${{ github.event.inputs.full_recrawl || 'false' }}
          DETAIL_CONCURRENCY: "2"
          DETAIL_DELAY_MS: "250"
          DETAIL_REFRESH_HOURS: "168"
          POPULAR_REFRESH_HOURS: "6"
          POPULAR_INSTALL_THRESHOLD: "10000"
          USER_AGENT: "MstySkillsIndexer/0.1 (+https://github.com/mstystudio/msty-skills-indexer)"
        run: npm run scrape
